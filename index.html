<!DOCTYPE html>
<html lang="es" data-theme="corporate">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <title>NX036</title>
    <meta name="description" content="NX036: Token deflacionario en BNB Chain con e-commerce integrado, staking airdrop y transparencia on-chain.">
  </head>
  <body>
    <div id="splash" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f9fafb;transition:opacity .6s ease,visibility .6s ease">
      <style>
        @keyframes spin-y{0%{transform:rotateY(0deg)}100%{transform:rotateY(360deg)}}
        @keyframes pulse-ring{0%,100%{opacity:.15;transform:scale(.95)}50%{opacity:.35;transform:scale(1.08)}}
        #splash.hide{opacity:0;visibility:hidden}
        .splash-logo{width:80px;height:80px;border-radius:20px;background:linear-gradient(135deg,#1a5276,#2e86c1);display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Roboto',sans-serif;font-weight:700;font-size:22px;letter-spacing:1px;animation:spin-y 2s cubic-bezier(.4,0,.2,1) infinite;box-shadow:0 8px 30px rgba(26,82,118,.25)}
        .splash-ring{position:absolute;width:110px;height:110px;border-radius:26px;border:2px solid #2e86c1;animation:pulse-ring 2s ease-in-out infinite}
        .splash-text{margin-top:28px;font-family:'Roboto',sans-serif;font-weight:300;font-size:14px;color:#64748b;letter-spacing:.15em;text-transform:uppercase}
        .splash-dots::after{content:'';animation:dots 1.5s steps(4,end) infinite}
        @keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
      </style>
      <div style="position:relative;display:flex;align-items:center;justify-content:center">
        <div class="splash-ring"></div>
        <div class="splash-logo">NX</div>
      </div>
      <div class="splash-text">Cargando NX036<span class="splash-dots"></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
